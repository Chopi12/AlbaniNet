<main class="main">
  <div class="contain">
    <h2 class="form-title title">Бронирование</h2>

    <form action="" class="book-form">
      <div class="form-time content">
        <div class="form-content">
          <label for="data">Дата</label>
          <input
            required type="date" name="data" id="data"
          >
        </div>
        <div class="form-content">
          <label for="time">Время</label>
          <input
            required
            type="time" name="time" id="time" min="09:00" max="23:00" step="900"
          >
        </div>
      </div>
      <div class="form-table content">
        <div class="form-content">
          <label for="type-tables">Вид столика(-ов)</label>
          <select class="select-tables" id="type-tables" required>
            <option value="" disabled selected>---Выберите столик---</option>
            <option value="main">Обычный (расчитан до 4 человек)</option>
            <option value="window">У окнонный (расчитан до 2 человек)</option>
            <option value="terrace">Терасса (расчитана до 8 человек)</option>
            <option value="hall">Отдельный зал (расчитан до 15 человек)</option>
          </select>
        </div>
        <div class="form-content">
          <label for="count-tables">Количество столика(-ов) (до 10)*</label>
          <input
            required
            type="number" name="count-tables" id="count-tables" min="1" max="10"
            placeholder="Введите количество столиков"
          >
        </div>
        <div class="form-content">
          <label for="count-persons">Количество людей (до 30)*</label>
          <input
            required
            type="number" min="1" max="30" name="count-persons"
            id="count-persons"
            placeholder="Введите количество людей"
          >
        </div>
      </div>
      <div class="form-contacts content">
        <div class="form-content">
          <label for="user-name">Имя</label>
          <input
            required
            type="text"
            name="user-name"
            id="user-name"
            placeholder="Введите имя"
          />
        </div>
        <div class="form-content">
          <label for="user-surname">Фамилия</label>
          <input
            required
            type="text"
            name="user-surname"
            id="user-surname"
            placeholder="Введите фамилию"
          />
        </div>
        <div class="form-content">
          <label for="user-phone">Номер</label>
          <input
            required
            type="tel"
            name="user-phone"
            id="user-phone"
            placeholder="Введите номер телефона"
          />
        </div>
        <div class="form-content">
          <label for="user-email">Почта</label>
          <input
            required
            type="email"
            name="user-email"
            id="user-email"
            placeholder="Введите почту"
          />
        </div>
        <div class="form-content">
          <label for="comment">Комментарий</label>
          <textarea
            name="comment" id="comment" cols="auto" rows="2"
            placeholder="Введите комментарий"
          ></textarea>
        </div>
      </div>
      <button type="submit">Забронировать</button>
    </form>
  </div>
</main>
